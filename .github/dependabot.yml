# Dependabot configuration for Kairo repository
# Automatically checks for package and action updates on a weekly schedule.

version: 2
updates:
  # Maintain npm dependencies for the browser extension
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'

  # Maintain GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
